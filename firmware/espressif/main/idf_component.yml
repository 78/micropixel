dependencies:
  idf:
    version: ">=5.1"
  78/esp-http3:
    version: "1.6.2"
  lvgl/lvgl:
    version: "9.6.0~1"
    rules:
      - if: "target in [esp32p4, esp32s31, esp32s3]"
  espressif/esp_lvgl_adapter:
    version: "^0.6.2"
    override_path: "../components/esp-iot-solution/components/display/tools/esp_lvgl_adapter"
    rules:
      - if: "target in [esp32p4, esp32s31, esp32s3]"
  espressif/esp_lcd_touch_gt911:
    version: "^1.2.0"
    rules:
      - if: "target in [esp32p4, esp32s3]"
  # KSDIY P4C5 board support: ST7102 MIPI-DSI panel, ST7123 touch and AXP2101
  # rails. Only the KSDIY profile links it.
  kevincoooool/ksdiy_p4c5_bsp:
    version: "~1.3.3"
    rules:
      - if: "target == esp32p4"
      - if: "$CONFIG{MICROPIXEL_BOARD_KSDIY_P4C5} == True"
  # The BSP's ST7123 driver: a fork of espressif/esp_lcd_touch_st7123 1.0.2 with
  # per-finger track IDs, a bounded report count and an INT pull-up, none of
  # which upstream has yet. Pinned to the range verified on the board.
  kevincoooool/esp_lcd_touch_st7123:
    version: "~1.0.2"
    rules:
      - if: "target == esp32p4"
      - if: "$CONFIG{MICROPIXEL_BOARD_KSDIY_P4C5} == True"
  espressif/esp_lcd_touch_tt21100:
    version: "^1.0.0"
    rules:
      - if: "target == esp32s3"
  espressif/esp_lcd_ili9341:
    version: "^2.0.1"
    rules:
      - if: "target == esp32s3"
  # SenseCAP Watcher's panel driver. It is vendored in the esp-iot-solution
  # submodule rather than fetched from the registry, the way esp_lvgl_adapter
  # above is, so the build stays offline and pinned to the checked-out source.
  espressif/esp_lcd_spd2010:
    version: "2.0.0~1"
    override_path: "../components/esp-iot-solution/components/display/lcd/esp_lcd_spd2010"
    rules:
      - if: "target == esp32s3"
  espressif/esp_lcd_touch_spd2010:
    version: "2.0.1"
    # Patched copy, not the submodule: the vendored component cannot read
    # registers on ESP-IDF 6.1. The copy differs by one line, documented in
    # firmware/espressif/patched_components/esp_lcd_touch_spd2010/README.md.
    override_path: "../patched_components/esp_lcd_touch_spd2010"
    rules:
      - if: "target == esp32s3"
  espressif/icm42670:
    version: "^2.0.2"
    rules:
      - if: "target == esp32s3"
  espressif/esp_lcd_touch_ft5x06:
    version: "^1.0.7"
    rules:
      - if: "target == esp32s3"
  espressif/button:
    version: "^4.2.0"
  espressif/cjson:
    version: "^1.7.19"
  espressif/esp_mmap_assets:
    version: "2.0.0"
  espressif/esp_tinyusb:
    version: "2.2.1"
    rules:
      - if: "target == esp32s31"
  espressif/esp_lcd_co5300:
    version: "2.1.0"
    rules:
      - if: "target == esp32s31"
  espressif/spi_nand_flash:
    version: "^1.4.3"
    rules:
      - if: "target == esp32s31"
  espressif/esp_codec_dev:
    version: "^1.6.2"
    rules:
      - if: "target in [esp32p4, esp32s31, esp32s3]"
  78/esp_lcd_touch_cst92xx:
    version: "^0.1.0"
    rules:
      - if: "target == esp32s31"
  espressif/esp_new_jpeg:
    version: "1.*"
  espressif/libpng:
    version: "1.*"
  esphome/micro-opus:
    version: "0.4.1"
  espressif/esp_wifi_remote:
    version: ">=0.10,<2.0"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    version: "~2"
    rules:
      - if: "target == esp32p4"
  78/uart-uhci:
    version: "0.4.0"
    rules:
      - if: "target == esp32p4"
  78/uart-eth-modem:
    version: "0.7.0"
    rules:
      - if: "target == esp32p4"
  espressif/iot_eth:
    version: "1.1.0"
    rules:
      - if: "target == esp32p4"
  espressif/esp_lcd_ili9881c:
    version: "^1.0.1"
    rules:
      - if: "target == esp32p4"
