name: Windows toolchain verification
on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-sdk-bootstrap']
  pull_request:
    paths:
      - 'tools/**'
      - 'guest/**'
      - '.github/workflows/windows-toolchain.yml'
      - 'firmware/espressif/components/wasm-micro-runtime'
permissions:
  contents: read
concurrency:
  group: windows-toolchain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        target: [riscv32-ilp32f, xtensa]
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Windows path regressions
        run: python -m unittest tools.tests.test_windows_toolchain -v
      - name: Initialize pinned WAMR only
        run: git submodule update --init firmware/espressif/components/wasm-micro-runtime
      - name: Activate MSVC x64
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
      - name: Cache exact LLVM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/windows/${{ matrix.target }}/llvm-*
          key: windows-2022-llvm-${{ matrix.target }}-${{ hashFiles('tools/windows/toolchain-sources.json', 'tools/windows/build_toolchain.py') }}
      - name: Build pinned AOT compiler
        run: python tools/windows/build_toolchain.py --target ${{ matrix.target }}
      - name: Compile and validate real applications
        run: python tools/windows/verify_build.py --target ${{ matrix.target }}
      - name: Upload verified compiler
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wamrc-windows-x64-${{ matrix.target }}
          path: build/windows/${{ matrix.target }}/dist/
          if-no-files-found: error
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            build/windows/${{ matrix.target }}/**/CMakeConfigureLog.yaml
            build/windows/${{ matrix.target }}/**/CMakeCache.txt
