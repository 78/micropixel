dependencies:
  idf:
    version: ">=5.1"
  78/esp-http3:
    version: "1.6.0"
  lvgl/lvgl:
    version: "^9.5.0"
    rules:
      - if: "target in [esp32p4, esp32s31]"
  espressif/esp_lvgl_adapter:
    version: "^0.6.2"
    override_path: "../components/esp-iot-solution/components/display/tools/esp_lvgl_adapter"
    rules:
      - if: "target in [esp32p4, esp32s31]"
  espressif/esp_lcd_touch_gt911:
    version: "^1.2.0"
    rules:
      - if: "target == esp32p4"
  espressif/button:
    version: "^4.2.0"
  espressif/cjson:
    version: "^1.7.19"
  espressif/esp_mmap_assets:
    version: "2.0.0"
  espressif/esp_tinyusb:
    version: "2.2.1"
    rules:
      - if: "target == esp32s31"
  espressif/esp_lcd_co5300:
    version: "2.1.0"
    rules:
      - if: "target == esp32s31"
  espressif/esp_codec_dev:
    version: "^1.6.2"
    rules:
      - if: "target == esp32s31"
  78/esp_lcd_touch_cst92xx:
    version: "^0.1.0"
    rules:
      - if: "target == esp32s31"
  espressif/esp_new_jpeg:
    version: "1.*"
  espressif/libpng:
    version: "1.*"
  esphome/micro-opus:
    version: "0.4.1"
  espressif/esp_wifi_remote:
    version: ">=0.10,<2.0"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    version: "~2"
    rules:
      - if: "target == esp32p4"
