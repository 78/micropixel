name: SDK manager and archive tests
on:
  workflow_dispatch:
  push:
    branches: ['codex/sdk-version-manager', 'codex/windows-sdk-installer', 'codex/windows-sdk-release', 'codex/windows-toolchain-release', 'codex/windows-sdk-runtime']
  pull_request:
    paths: ['tools/**', 'guest/sdk/**', '.github/workflows/windows-sdk-tests.yml']
permissions:
  contents: read
concurrency:
  group: sdk-manager-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.12'
      - name: Test archive, locks, JSON and Windows paths
        run: python -m unittest tools.tests.test_windows_toolchain tools.tests.test_sdk_release tools.tests.test_sdk_manager tools.tests.test_cli_json -v
      - name: Inventory Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/windows/inspect_crt.ps1
      - name: Assemble and probe isolated Windows Python runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/windows/build_manager.py --output 'build/中文 runtime'
          if ($LASTEXITCODE -ne 0) { throw 'Runtime assembly failed' }
          $build = Get-Content -Raw 'build/中文 runtime/manager-build.json' | ConvertFrom-Json
          $runtime = Join-Path 'build/中文 runtime' $build.directory
          $raw = & (Join-Path $runtime 'python/python.exe') -I -X utf8 (Join-Path $runtime 'micropixel_manager.py') manager-version --json
          if ($LASTEXITCODE -ne 0) { throw 'Embedded runtime failed' }
          $result = $raw | ConvertFrom-Json
          if (-not $result.ok -or $result.result.python_version -ne '3.13.12' -or $result.result.pyserial_version -ne '3.5') { throw 'Embedded runtime versions differ from pins' }
