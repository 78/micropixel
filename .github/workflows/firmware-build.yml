name: Build release firmware in parallel
on:
  workflow_dispatch:
    inputs:
      reuse_hosts_run:
        description: Reuse successful Host artifacts from a previous run
        type: string
        default: ""
      rebuild_profiles:
        description: Comma-separated profiles to rebuild when reusing a run
        type: string
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: firmware-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: select
        env:
          REUSE_RUN: ${{ inputs.reuse_hosts_run }}
          REBUILD_PROFILES: ${{ inputs.rebuild_profiles }}
        run: python3 tools/ci/plan_hosts.py
  guests:
    name: Shared Guest bundles (two architectures)
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.12'
      - name: Wait for matching verified SDK and install its published tools
        shell: pwsh
        run: |
          $version = (Select-String -Path tools/micropixel -Pattern '^VERSION = "([^"]+)"').Matches.Groups[1].Value
          if (-not $version) { throw 'Cannot read SDK version' }
          $tag = "sdk-v$version"
          $ready = $false
          for ($attempt = 0; $attempt -lt 90; $attempt++) {
            $raw = gh release view $tag --json isDraft,assets 2>$null
            if ($LASTEXITCODE -eq 0) {
              $release = $raw | ConvertFrom-Json
              $support = gh release view "sdk-support-v$version" --json assets 2>$null
              if (-not $release.isDraft -and $LASTEXITCODE -eq 0 -and ($support | ConvertFrom-Json).assets.name -contains 'public-verification.json') { $ready = $true; break }
            }
            Start-Sleep -Seconds 10
          }
          if (-not $ready) { throw 'Matching SDK public verification is not ready' }
          $commit = gh api "repos/$env:GH_REPO/git/ref/tags/$tag" --jq '.object.sha'
          if ($commit.Trim() -ne $env:GITHUB_SHA) {
            git fetch origin "refs/tags/$tag`:refs/tags/$tag" --depth=1
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect SDK source tag' }
            git diff --exit-code $tag HEAD -- guest tools/micropixel tools/build_app_bundle.py tools/generate_localization.py tools/analyze_sfx.py
            if ($LASTEXITCODE -ne 0) { throw 'Published SDK sources differ from firmware Guest sources' }
          }
          New-Item -ItemType Directory -Force build/sdk | Out-Null
          gh release download $tag --pattern windows-installer.json --dir build/sdk
          if ($LASTEXITCODE -ne 0) { throw 'Installer metadata download failed' }
          $meta = Get-Content -Raw build/sdk/windows-installer.json | ConvertFrom-Json
          gh release download $tag --pattern $meta.name --dir build/sdk
          if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
          $path = Join-Path build/sdk $meta.name
          if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $meta.sha256) { throw 'Installer checksum differs' }
          $process = Start-Process -FilePath $path -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /SP- /NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'SDK installer failed' }
          & "$env:LOCALAPPDATA\MicroPixel\bin\micropixel.exe" setup --version $version --yes --json
          if ($LASTEXITCODE -ne 0) { throw 'SDK setup failed' }
      - name: Build shared example images once per architecture
        run: python tools/ci/firmware_artifacts.py guest --launcher "$env:LOCALAPPDATA\MicroPixel\bin\micropixel.exe" --output build/ci-guests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmware-guests
          path: build/ci-guests/
          retention-days: 14
  hosts:
    needs: plan
    if: ${{ !inputs.reuse_hosts_run || inputs.rebuild_profiles != '' }}
    name: Host ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      IDF_PATH: ${{ github.workspace }}/.ci/esp-idf
      IDF_CCACHE_ENABLE: '1'
      MICROPIXEL_REMOTE_CONTROL_HOST: ${{ secrets.MICROPIXEL_REMOTE_CONTROL_HOST }}
      MICROPIXEL_REMOTE_CONTROL_PORT: ${{ secrets.MICROPIXEL_REMOTE_CONTROL_PORT }}
      MICROPIXEL_REMOTE_CONTROL_ALLOW_UNVERIFIED_TLS: ${{ secrets.MICROPIXEL_REMOTE_CONTROL_ALLOW_UNVERIFIED_TLS }}
      MICROPIXEL_REMOTE_CONTROL_TRUSTED_CA_DER_BASE64: ${{ secrets.MICROPIXEL_REMOTE_CONTROL_TRUSTED_CA_DER_BASE64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Read fixed ESP-IDF revision
        run: echo "IDF_REVISION=$(python3 -c 'import json; print(json.load(open("tools/ci/firmware-sources.json"))["esp_idf_commit"])')" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: espressif/esp-idf
          ref: ${{ env.IDF_REVISION }}
          path: .ci/esp-idf
          submodules: recursive
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.espressif
          key: idf-linux-${{ matrix.chip }}-${{ env.IDF_REVISION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.profile }}-${{ env.IDF_REVISION }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.profile }}-${{ env.IDF_REVISION }}-
      - name: Install fixed IDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build ccache libusb-1.0-0 python3-venv clang-18 libc++-18-dev libc++abi-18-dev
          "$IDF_PATH/install.sh" ${{ matrix.chip }}
      - name: Compile this board and verify embedded release configuration
        run: |
          bash tools/${{ matrix.wrapper }}
          . "$IDF_PATH/export.sh" >/dev/null
          python tools/ci/firmware_artifacts.py collect --profile ${{ matrix.profile }} --output build/ci-host/${{ matrix.profile }}
      - name: Run shared Host regression once
        if: matrix.profile == 'metalio-claw4'
        run: |
          printf '#!/bin/sh\nexec /usr/bin/clang++-18 -stdlib=libc++ "$@"\n' > "$RUNNER_TEMP/host-cxx"
          chmod +x "$RUNNER_TEMP/host-cxx"
          CXX="$RUNNER_TEMP/host-cxx" CC=/usr/bin/clang-18 bash tools/tests/test_firmware_host.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-${{ matrix.profile }}
          path: build/ci-host/${{ matrix.profile }}/
          retention-days: 14
  assemble:
    name: Assemble verified release artifacts
    needs: [guests, hosts]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    if: ${{ always() && needs.guests.result == 'success' && (needs.hosts.result == 'success' || needs.hosts.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: firmware-guests
          path: build/ci-guests
      - name: Wait for all reused Host jobs to succeed
        if: inputs.reuse_hosts_run != ''
        env:
          REUSE_RUN: ${{ inputs.reuse_hosts_run }}
          REBUILD_PROFILES: ${{ inputs.rebuild_profiles }}
        run: python3 tools/ci/wait_hosts.py --run "$REUSE_RUN" --exclude "$REBUILD_PROFILES"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: host-*
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_hosts_run || github.run_id }}
          path: build/host-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.reuse_hosts_run != '' && inputs.rebuild_profiles != ''
        with:
          pattern: host-*
          path: build/host-artifacts
      - name: Assemble all five full images
        run: |
          mkdir -p build/ci-host
          for directory in build/host-artifacts/host-*; do
            mv "$directory" "build/ci-host/$(basename "$directory" | sed 's/^host-//')"
          done
          python3 tools/ci/firmware_artifacts.py assemble --inputs build/ci-host --guests build/ci-guests --output build/firmware-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmware-release
          path: build/firmware-release/
          retention-days: 30
